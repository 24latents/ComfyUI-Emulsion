[project]
name = "comfyui-emulsion"
description = "JSON-preset color grading for ComfyUI (Lightroom-preset style) — replaces a chain of post-processing nodes with a single node, plus a preset extraction node."
version = "0.2.0"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/24latents/ComfyUI-Emulsion"

[tool.pytest.ini_options]
# __init__.py at the repo root (required by ComfyUI): without importlib,
# pytest would try to import the tests as submodules of the package.
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.comfy]
PublisherId = ""
DisplayName = "Emulsion"
Icon = ""
